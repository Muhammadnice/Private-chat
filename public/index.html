<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Web</title>
    
    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Socket.io client dependency -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #0f1721;
            color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Official Telegram Chat Background Pattern */
        .chat-bg {
            background-color: #0e1621;
            background-image: radial-gradient(#1c2938 1.2px, transparent 1.2px);
            background-size: 24px 24px;
        }

        /* Custom Telegram Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Message Tails */
        .msg-out::before {
            content: "";
            position: absolute;
            right: -7px;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 9px solid #2b5278;
            border-top: 9px solid transparent;
        }

        .msg-in::before {
            content: "";
            position: absolute;
            left: -7px;
            bottom: 0;
            width: 0;
            height: 0;
            border-right: 9px solid #182533;
            border-top: 9px solid transparent;
        }

        /* Circular Video Notes */
        .video-note-bubble {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #5288c1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Animations */
        @keyframes msgPop {
            0% { opacity: 0; transform: scale(0.96) translateY(6px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-msg {
            animation: msgPop 0.15s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        @keyframes typingPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .typing-dot {
            animation: typingPulse 1s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        .context-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-[#0f1721]">

    <!-- Main Telegram App Interface Container -->
    <div class="w-full max-w-6xl h-full md:h-[96vh] flex bg-[#17212b] md:rounded-2xl shadow-2xl overflow-hidden border border-[#0e1621] relative">

        <!-- Sidebar / Chat Rooms Panel -->
        <aside id="sidebar" class="w-full md:w-80 bg-[#17212b] border-r border-[#0e1621] flex flex-col z-20 absolute md:relative h-full transition-transform duration-300 transform md:transform-none">
            <!-- Sidebar Header -->
            <div class="p-3 flex items-center justify-between border-b border-[#0e1621]">
                <button onclick="showToast('Telegram Settings coming soon')" class="p-2.5 text-[#7f91a4] hover:text-white rounded-full transition-colors">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="relative flex-1 mx-2">
                    <input type="text" id="sidebarSearch" placeholder="Search..." class="w-full bg-[#0e1621] text-xs text-white pl-8 pr-3 py-2 rounded-full border border-transparent focus:border-sky-500/50 outline-none">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-[#7f91a4]"></i>
                </div>
            </div>

            <!-- Active Room Item -->
            <div class="flex-1 overflow-y-auto">
                <div class="p-3 bg-[#202b36] flex items-center space-x-3 cursor-pointer border-b border-[#0e1621] transition-colors">
                    <div class="relative w-12 h-12 rounded-full bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center font-bold text-white text-lg shadow-md">
                        <span id="sidebarInitials">TG</span>
                        <div id="sidebarOnlineBadge" class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-[#17212b] rounded-full"></div>
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <div class="flex justify-between items-baseline">
                            <h2 class="text-sm font-medium text-white truncate" id="sidebarRoomTitle">Private Chat Room</h2>
                            <span class="text-[11px] text-[#7f91a4]" id="sidebarTime">Active</span>
                        </div>
                        <p class="text-xs text-[#7f91a4] truncate" id="sidebarLastMsg">Click to view dynamic room messages</p>
                    </div>
                </div>
            </div>

            <!-- Sidebar Footer User Quick Link -->
            <div class="p-3 border-t border-[#0e1621] bg-[#17212b] flex items-center justify-between text-xs text-[#7f91a4]">
                <span>No Account Required</span>
                <button onclick="copyShareLink()" class="text-sky-400 hover:underline flex items-center gap-1">
                    <i class="fa-solid fa-link"></i> Copy Link
                </button>
            </div>
        </aside>

        <!-- Main Workspace Chat Window -->
        <main class="flex-1 flex flex-col h-full bg-[#0e1621] relative">

            <!-- Chat Header -->
            <header class="bg-[#17212b] px-4 py-2.5 flex items-center justify-between border-b border-[#0e1621] z-10 select-none">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleMobileSidebar()" class="md:hidden p-2 text-[#7f91a4] hover:text-white">
                        <i class="fa-solid fa-arrow-left text-lg"></i>
                    </button>
                    
                    <!-- Avatar -->
                    <div class="relative w-10 h-10 rounded-full bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center font-bold text-white text-base shadow cursor-pointer">
                        <span id="chatInitials">TG</span>
                        <div id="headerStatusDot" class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-[#17212b] rounded-full"></div>
                    </div>

                    <!-- Peer Info -->
                    <div class="flex flex-col cursor-pointer">
                        <h1 class="text-sm font-medium text-white flex items-center gap-1.5">
                            <span id="chatTitle">Private Room</span>
                            <i class="fa-solid fa-circle-check text-xs text-sky-400" title="Verified Session"></i>
                        </h1>
                        <span id="chatStatus" class="text-xs text-sky-400 transition-all">online</span>
                    </div>
                </div>

                <!-- Action Controls -->
                <div class="flex items-center space-x-1 text-[#7f91a4]">
                    <!-- In-Chat Search Bar -->
                    <div id="searchBarContainer" class="hidden items-center bg-[#0e1621] px-2.5 py-1 rounded-lg border border-[#202b36]">
                        <input type="text" id="chatSearchInput" oninput="filterMessages()" placeholder="Search chat..." class="bg-transparent text-xs text-white focus:outline-none w-28 sm:w-44">
                        <button onclick="toggleChatSearch()" class="text-xs text-gray-400 hover:text-white px-1"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    <button onclick="toggleChatSearch()" class="p-2.5 hover:bg-[#202b36] hover:text-white rounded-full transition-colors" title="Search Chat">
                        <i class="fa-solid fa-magnifying-glass text-sm"></i>
                    </button>
                    <button onclick="copyShareLink()" class="p-2.5 hover:bg-[#202b36] hover:text-white rounded-full transition-colors hidden sm:flex items-center gap-1.5 bg-[#202b36]/60 px-3 border border-white/5" title="Copy Invite Link">
                        <i class="fa-regular fa-copy text-sky-400"></i>
                        <span class="text-xs font-medium text-slate-200">Share Link</span>
                    </button>
                    <button onclick="showToast('Voice call feature active')" class="p-2.5 hover:bg-[#202b36] hover:text-white rounded-full transition-colors" title="Call">
                        <i class="fa-solid fa-phone text-sm"></i>
                    </button>
                </div>
            </header>

            <!-- Pinned Message Banner -->
            <div id="pinBanner" class="hidden bg-[#182533] px-4 py-2 border-b border-[#0e1621] flex items-center justify-between text-xs cursor-pointer hover:bg-[#1e2c3c] transition-colors">
                <div class="flex items-center space-x-3 overflow-hidden" onclick="scrollToPinned()">
                    <div class="w-1 h-7 bg-sky-400 rounded-full"></div>
                    <div class="flex flex-col overflow-hidden">
                        <span class="text-sky-400 font-medium text-[11px]">Pinned Message</span>
                        <span id="pinText" class="text-slate-300 truncate text-xs">...</span>
                    </div>
                </div>
                <button onclick="unpinMessage()" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Chat Messages Area -->
            <section id="chatWindow" class="flex-1 chat-bg p-4 overflow-y-auto space-y-2.5 flex flex-col" onclick="closeContextMenu()">
                <!-- End-to-End Encryption Tag -->
                <div class="mx-auto my-2 px-4 py-1.5 rounded-full bg-[#111921]/85 border border-white/5 text-[11px] text-[#7f91a4] text-center shadow-inner select-none max-w-xs">
                    <i class="fa-solid fa-lock text-emerald-400 mr-1"></i> End-to-end link encrypted room
                </div>
            </section>

            <!-- Reply Preview Bar -->
            <div id="replyBar" class="hidden bg-[#182533] px-4 py-2 border-t border-[#0e1621] flex items-center justify-between text-xs text-sky-400">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <i class="fa-solid fa-reply"></i>
                    <div class="flex flex-col overflow-hidden">
                        <span class="font-medium text-[11px]">Replying to</span>
                        <span id="replyPreviewText" class="text-slate-200 truncate italic"></span>
                    </div>
                </div>
                <button onclick="cancelReply()" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Edit Message Bar -->
            <div id="editBar" class="hidden bg-[#182533] px-4 py-2 border-t border-[#0e1621] flex items-center justify-between text-xs text-amber-400">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <i class="fa-solid fa-pen"></i>
                    <div class="flex flex-col overflow-hidden">
                        <span class="font-medium text-[11px]">Edit Message</span>
                        <span id="editPreviewText" class="text-slate-200 truncate italic"></span>
                    </div>
                </div>
                <button onclick="cancelEdit()" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Chat Input Footer Bar -->
            <footer class="bg-[#17212b] p-3 border-t border-[#0e1621] flex items-center space-x-2 relative select-none">
                <!-- Attachments Menu Button & Hidden Native Input -->
                <button onclick="document.getElementById('fileInput').click()" class="p-2.5 text-[#7f91a4] hover:text-white hover:bg-[#202b36] rounded-full transition-colors" title="Attach Media">
                    <i class="fa-solid fa-paperclip text-lg"></i>
                </button>
                <input type="file" id="fileInput" class="hidden" accept="image/*,video/*,audio/*,.pdf,.doc,.txt" onchange="handleFileSelect(event)">

                <!-- Input Field Wrap -->
                <div class="flex-1 bg-[#0e1621] rounded-2xl flex items-center px-4 py-2 border border-[#202b36] focus-within:border-sky-500/50 transition-colors relative">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Write a message..." 
                        class="w-full bg-transparent text-sm text-white placeholder-[#7f91a4] focus:outline-none"
                        autocomplete="off"
                        onkeydown="handleKeyDown(event)"
                        oninput="handleTyping()"
                    >
                    
                    <!-- Emoji Picker Trigger Button -->
                    <button onclick="toggleEmojiPicker()" class="text-[#7f91a4] hover:text-yellow-400 transition-colors ml-2" title="Emoji">
                        <i class="fa-regular fa-face-smile text-lg"></i>
                    </button>

                    <!-- Emoji Popup Box -->
                    <div id="emojiPicker" class="hidden absolute right-0 bottom-12 bg-[#17212b] border border-[#202b36] rounded-xl p-3 shadow-2xl grid grid-cols-6 gap-2 z-50 text-xl">
                        <span class="cursor-pointer hover:scale-125 transition-transform" onclick="insertEmoji('👍')">👍</span>
                        <span class="cursor-pointer hover:scale-125 transition-transform" onclick="insertEmoji('❤️')">❤️</span>
                        <span class="cursor-pointer hover:scale-125 transition-transform" onclick="insertEmoji('😂')">😂</span>
                        <span class="cursor-pointer hover:scale-125 transition-transform" onclick="insertEmoji('🔥')">🔥</span>
                        <span class="cursor-pointer hover:scale-125 transition-transform" onclick="insertEmoji('😮')">😮</span>
                        <span class="cursor-pointer hover:scale-125 transition-transform" onclick="insertEmoji('😢')">😢</span>
                        <span class="cursor-pointer hover:scale-125 transition-transform" onclick="insertEmoji('🎉')">🎉</span>
                        <span class="cursor-pointer hover:scale-125 transition-transform" onclick="insertEmoji('👏')">👏</span>
                        <span class="cursor-pointer hover:scale-125 transition-transform" onclick="insertEmoji('💯')">💯</span>
                        <span class="cursor-pointer hover:scale-125 transition-transform" onclick="insertEmoji('🙏')">🙏</span>
                        <span class="cursor-pointer hover:scale-125 transition-transform" onclick="insertEmoji('🚀')">🚀</span>
                        <span class="cursor-pointer hover:scale-125 transition-transform" onclick="insertEmoji('😍')">😍</span>
                    </div>
                </div>

                <!-- Media Action Controls -->
                <div class="flex items-center space-x-1">
                    <!-- Audio/Video Note Switch Toggle -->
                    <button id="mediaModeBtn" onclick="toggleMediaMode()" class="p-2.5 text-[#7f91a4] hover:text-white hover:bg-[#202b36] rounded-full transition-colors" title="Switch to Video Note">
                        <i id="mediaModeIcon" class="fa-solid fa-video text-base"></i>
                    </button>

                    <!-- Primary Action Button (Send / Record) -->
                    <button 
                        id="sendBtn" 
                        onclick="handleSendOrRecord()" 
                        class="w-10 h-10 rounded-full bg-[#5288c1] hover:bg-[#6297d0] active:scale-95 text-white flex items-center justify-center transition-all shadow-md"
                        title="Send or Hold/Click Record"
                    >
                        <i id="sendIcon" class="fa-solid fa-microphone text-base"></i>
                    </button>
                </div>
            </footer>
        </main>
    </div>

    <!-- Context Menu for Messages -->
    <div id="contextMenu" class="hidden absolute bg-[#17212b] border border-[#202b36] rounded-xl py-1 z-50 w-48 text-sm text-slate-200 context-shadow select-none">
        <button onclick="contextAction('reply')" class="w-full text-left px-4 py-2 hover:bg-[#202b36] flex items-center space-x-3">
            <i class="fa-solid fa-reply text-sky-400 w-4"></i><span>Reply</span>
        </button>
        <button onclick="contextAction('copy')" class="w-full text-left px-4 py-2 hover:bg-[#202b36] flex items-center space-x-3">
            <i class="fa-regular fa-copy text-emerald-400 w-4"></i><span>Copy Text</span>
        </button>
        <button onclick="contextAction('edit')" id="ctxEditBtn" class="w-full text-left px-4 py-2 hover:bg-[#202b36] flex items-center space-x-3">
            <i class="fa-solid fa-pen text-amber-400 w-4"></i><span>Edit</span>
        </button>
        <button onclick="contextAction('pin')" class="w-full text-left px-4 py-2 hover:bg-[#202b36] flex items-center space-x-3">
            <i class="fa-solid fa-thumbtack text-indigo-400 w-4"></i><span>Pin Message</span>
        </button>
        <button onclick="contextAction('react')" class="w-full text-left px-4 py-2 hover:bg-[#202b36] flex items-center space-x-3">
            <i class="fa-regular fa-face-smile text-yellow-400 w-4"></i><span>Add Reaction</span>
        </button>
        <hr class="border-[#202b36] my-1">
        <button onclick="contextAction('delete')" class="w-full text-left px-4 py-2 hover:bg-[#202b36] text-rose-400 flex items-center space-x-3">
            <i class="fa-solid fa-trash w-4"></i><span>Delete</span>
        </button>
    </div>

    <!-- Toast Notification Banner -->
    <div id="toast" class="fixed bottom-16 bg-[#2b5278] text-white text-xs px-4 py-2.5 rounded-lg shadow-xl border border-sky-400/30 opacity-0 pointer-events-none transition-all duration-300 transform translate-y-4 flex items-center gap-2 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">Action completed!</span>
    </div>

    <script>
        /*
        ========================================================================
        TELEGRAM WEB COMPLETE CLIENT JS LOGIC
        ========================================================================
        Includes real-time Socket.io communication, dynamic tick receipts, Web Audio
        sound synthesis, voice/video note recorders, reactions, edit, pin, search.
        */

        let socket = null;
        let roomId = "main-room";
        let mySocketId = "usr_" + Math.random().toString(36).substring(2, 7);
        let editingMessageId = null;
        let replyingToMessageId = null;
        let selectedMsgContext = null;
        let pinnedMessageId = null;

        let currentMediaMode = 'audio'; // 'audio' or 'video'
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let typingTimeout = null;

        const messagesMap = new Map();

        // Web Audio Synthesizer (No external sound file downloads needed)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playTelegramSound(isOutgoing = false) {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';

                const startFreq = isOutgoing ? 600 : 400;
                const endFreq = isOutgoing ? 900 : 750;

                osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                console.warn("Audio Context Warning:", e);
            }
        }

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            setupRoomFromURL();
            initializeSocket();
            setupInputListeners();
        });

        function setupRoomFromURL() {
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            if (pathParts.length >= 2 && pathParts[0] === 'chat') {
                roomId = pathParts[1];
            } else {
                roomId = Math.random().toString(36).substring(2, 10);
                window.history.replaceState({}, '', `/chat/${roomId}`);
            }

            const initials = roomId.substring(0, 2).toUpperCase();
            document.getElementById('chatInitials').innerText = initials;
            document.getElementById('sidebarInitials').innerText = initials;
            document.getElementById('chatTitle').innerText = `Room: ${roomId}`;
            document.getElementById('sidebarRoomTitle').innerText = `Room: ${roomId}`;
        }

        function initializeSocket() {
            try {
                if (typeof io !== 'undefined') {
                    socket = io();

                    socket.on('connect', () => {
                        mySocketId = socket.id;
                        socket.emit('join-room', { roomId });
                    });

                    socket.on('receive-message', handleIncomingMessage);
                    socket.on('message-edited', handleRemoteEdit);
                    socket.on('message-deleted', handleRemoteDelete);
                    socket.on('message-read-update', handleReadReceipt);
                    socket.on('peer-typing', handlePeerTyping);
                    socket.on('room-status', handleRoomStatus);
                }
            } catch (e) {
                console.log("Socket running in client-standalone mode.");
            }
        }

        function setupInputListeners() {
            const input = document.getElementById('messageInput');
            const sendIcon = document.getElementById('sendIcon');

            input.addEventListener('input', () => {
                if (input.value.trim().length > 0) {
                    sendIcon.className = "fa-solid fa-paper-plane text-sm translate-x-[-1px]";
                } else {
                    sendIcon.className = currentMediaMode === 'audio' 
                        ? "fa-solid fa-microphone text-base" 
                        : "fa-solid fa-video text-base";
                }
            });
        }

        function handleTyping() {
            if (!socket) return;
            socket.emit('typing-status', { roomId, isTyping: true });

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing-status', { roomId, isTyping: false });
            }, 1500);
        }

        function handlePeerTyping(data) {
            const statusElem = document.getElementById('chatStatus');
            if (data.isTyping) {
                statusElem.innerHTML = `<span class="typing-dots">typing<span class="typing-dot">.</span><span class="typing-dot">.</span><span class="typing-dot">.</span></span>`;
            } else {
                statusElem.innerText = "online";
            }
        }

        function handleRoomStatus(data) {
            const statusDot = document.getElementById('headerStatusDot');
            const sidebarDot = document.getElementById('sidebarOnlineBadge');
            const chatStatus = document.getElementById('chatStatus');

            if (data.memberCount > 1) {
                statusDot.className = "absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-[#17212b] rounded-full";
                sidebarDot.className = "absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-[#17212b] rounded-full";
                chatStatus.innerText = `${data.memberCount} members online`;
            } else {
                statusDot.className = "absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-[#17212b] rounded-full";
                sidebarDot.className = "absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-[#17212b] rounded-full";
                chatStatus.innerText = "online";
            }
        }

        function toggleMediaMode() {
            if (isRecording) return;
            currentMediaMode = currentMediaMode === 'audio' ? 'video' : 'audio';
            const icon = document.getElementById('mediaModeIcon');
            const sendIcon = document.getElementById('sendIcon');
            const input = document.getElementById('messageInput');

            if (currentMediaMode === 'video') {
                icon.className = "fa-solid fa-microphone text-base";
                showToast("Switched to Video Note mode");
            } else {
                icon.className = "fa-solid fa-video text-base";
                showToast("Switched to Voice Note mode");
            }

            if (input.value.trim().length === 0) {
                sendIcon.className = currentMediaMode === 'audio' 
                    ? "fa-solid fa-microphone text-base" 
                    : "fa-solid fa-video text-base";
            }
        }

        function handleSendOrRecord() {
            const input = document.getElementById('messageInput');
            if (input.value.trim().length > 0 || editingMessageId) {
                sendMessage();
            } else {
                toggleRecording();
            }
        }

        // Voice & Video Note Recording System
        async function toggleRecording() {
            const sendBtn = document.getElementById('sendBtn');
            const sendIcon = document.getElementById('sendIcon');

            if (!isRecording) {
                try {
                    const constraints = currentMediaMode === 'video' 
                        ? { video: { width: 300, height: 300 }, audio: true } 
                        : { audio: true };

                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    mediaRecorder = new MediaRecorder(stream);
                    recordedChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) recordedChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const blob = new Blob(recordedChunks, { 
                            type: currentMediaMode === 'video' ? 'video/webm' : 'audio/webm' 
                        });
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = () => {
                            dispatchMediaMessage(reader.result, currentMediaMode === 'video' ? 'videonote' : 'voice');
                        };
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    sendBtn.classList.remove('bg-[#5288c1]');
                    sendBtn.classList.add('bg-rose-600', 'animate-pulse');
                    sendIcon.className = "fa-solid fa-stop text-base";
                    showToast(`Recording ${currentMediaMode === 'video' ? 'Video' : 'Voice'} Note...`);
                } catch (err) {
                    showToast("Microphone/Camera access required!");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                sendBtn.classList.remove('bg-rose-600', 'animate-pulse');
                sendBtn.classList.add('bg-[#5288c1]');
                sendIcon.className = currentMediaMode === 'audio' 
                    ? "fa-solid fa-microphone text-base" 
                    : "fa-solid fa-video text-base";
            }
        }

        // Attachment selection handler
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const dataUrl = e.target.result;
                let type = 'file';
                if (file.type.startsWith('image/')) type = 'image';
                else if (file.type.startsWith('video/')) type = 'video';
                else if (file.type.startsWith('audio/')) type = 'audio';

                dispatchMediaMessage(dataUrl, type, file.name);
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            if (editingMessageId) {
                // Perform message edit update
                const msgObj = messagesMap.get(editingMessageId);
                if (msgObj) {
                    msgObj.text = text;
                    msgObj.edited = true;
                    updateMessageUI(msgObj);
                    if (socket) socket.emit('edit-message', { id: editingMessageId, text, roomId });
                }
                cancelEdit();
                return;
            }

            const msgId = 'msg_' + Math.random().toString(36).substring(2, 11);
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

            const payload = {
                id: msgId,
                senderId: mySocketId,
                type: 'text',
                text: text,
                time: timeStr,
                replyTo: replyingToMessageId,
                edited: false,
                read: false
            };

            messagesMap.set(msgId, payload);
            renderMessageBubble(payload, true);
            playTelegramSound(true);

            if (socket) socket.emit('send-message', { ...payload, roomId });

            input.value = '';
            cancelReply();
            document.getElementById('sendIcon').className = currentMediaMode === 'audio' 
                ? "fa-solid fa-microphone text-base" 
                : "fa-solid fa-video text-base";
            document.getElementById('emojiPicker').classList.add('hidden');
        }

        function dispatchMediaMessage(dataUrl, mediaType, fileName = '') {
            const msgId = 'msg_' + Math.random().toString(36).substring(2, 11);
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

            const payload = {
                id: msgId,
                senderId: mySocketId,
                type: mediaType,
                mediaUrl: dataUrl,
                fileName: fileName,
                time: timeStr,
                replyTo: replyingToMessageId,
                read: false
            };

            messagesMap.set(msgId, payload);
            renderMessageBubble(payload, true);
            playTelegramSound(true);

            if (socket) socket.emit('send-message', { ...payload, roomId });
            cancelReply();
        }

        function handleIncomingMessage(data) {
            if (data.senderId === mySocketId) return;
            data.read = true;
            messagesMap.set(data.id, data);
            renderMessageBubble(data, false);
            playTelegramSound(false);

            if (socket) socket.emit('mark-read', { messageId: data.id, roomId });
        }

        function handleReadReceipt(data) {
            const msgObj = messagesMap.get(data.messageId);
            if (msgObj) {
                msgObj.read = true;
                const tickElem = document.getElementById(`tick-${data.messageId}`);
                if (tickElem) {
                    tickElem.className = "fa-solid fa-check-double text-[11px] text-[#64b5f6] ml-1";
                }
            }
        }

        function handleRemoteEdit(data) {
            const msgObj = messagesMap.get(data.id);
            if (msgObj) {
                msgObj.text = data.text;
                msgObj.edited = true;
                updateMessageUI(msgObj);
            }
        }

        function handleRemoteDelete(data) {
            const wrapper = document.getElementById(`wrapper-${data.id}`);
            if (wrapper) wrapper.remove();
            messagesMap.delete(data.id);
        }

        function renderMessageBubble(data, isMe) {
            const chatWindow = document.getElementById('chatWindow');
            const msgWrapper = document.createElement('div');
            msgWrapper.id = `wrapper-${data.id}`;
            msgWrapper.className = `flex ${isMe ? 'justify-end' : 'justify-start'} animate-msg mb-1 relative`;

            const bubble = document.createElement('div');
            bubble.id = `bubble-${data.id}`;
            bubble.className = `relative max-w-[85%] md:max-w-[70%] px-3 py-2 rounded-2xl text-sm shadow-md leading-relaxed break-words ${
                isMe 
                    ? 'bg-[#2b5278] text-white rounded-br-none msg-out' 
                    : 'bg-[#182533] text-slate-100 rounded-bl-none msg-in'
            }`;

            // Context Menu Event
            bubble.oncontextmenu = (e) => {
                e.preventDefault();
                showContextMenu(e, data.id, isMe);
            };

            // Reply Quote Construct
            let replyHTML = '';
            if (data.replyTo && messagesMap.has(data.replyTo)) {
                const parentMsg = messagesMap.get(data.replyTo);
                replyHTML = `
                    <div class="border-l-2 border-sky-400 pl-2 py-0.5 mb-1 bg-black/15 rounded text-xs text-sky-200 truncate cursor-pointer" onclick="scrollToMessage('${parentMsg.id}')">
                        <span class="font-bold text-[11px] block text-sky-400">Replying to message</span>
                        <span class="truncate block opacity-90">${escapeHTML(parentMsg.text || '[' + parentMsg.type + ']')}</span>
                    </div>
                `;
            }

            // Media & Text Content Construction
            let contentHTML = '';

            if (data.type === 'text') {
                contentHTML = `<div id="text-${data.id}" class="pr-12 pb-1">${escapeHTML(data.text)}</div>`;
            } else if (data.type === 'image') {
                contentHTML = `<div class="pb-2"><img src="${data.mediaUrl}" class="rounded-lg max-h-64 object-cover w-full cursor-pointer hover:opacity-95 transition-opacity" onclick="window.open('${data.mediaUrl}')"></div>`;
            } else if (data.type === 'video') {
                contentHTML = `<div class="pb-2"><video src="${data.mediaUrl}" controls class="rounded-lg max-h-64 w-full"></video></div>`;
            } else if (data.type === 'file') {
                contentHTML = `
                    <div class="pb-2 flex items-center space-x-3 bg-black/20 p-2 rounded-lg">
                        <i class="fa-solid fa-file-arrow-down text-2xl text-sky-400"></i>
                        <div class="flex flex-col overflow-hidden">
                            <span class="truncate font-medium text-xs">${escapeHTML(data.fileName || 'Attachment')}</span>
                            <a href="${data.mediaUrl}" download="${data.fileName || 'file'}" class="text-[11px] text-sky-300 hover:underline">Download</a>
                        </div>
                    </div>`;
            } else if (data.type === 'audio') {
                contentHTML = `<div class="pb-2 flex items-center gap-2"><audio src="${data.mediaUrl}" controls class="w-56 h-8 rounded"></audio></div>`;
            } else if (data.type === 'voice') {
                contentHTML = `
                    <div class="flex items-center space-x-3 py-1 pr-10">
                        <button onclick="toggleAudioSpeed('${data.id}')" id="speed-${data.id}" class="text-[10px] bg-sky-500/20 px-1.5 py-0.5 rounded text-sky-300 font-bold hover:bg-sky-500/40">1x</button>
                        <audio id="audio-${data.id}" src="${data.mediaUrl}" controls class="h-8 w-48 sm:w-56"></audio>
                    </div>`;
            } else if (data.type === 'videonote') {
                contentHTML = `
                    <div class="py-1 flex justify-center">
                        <video src="${data.mediaUrl}" controls autoplay loop muted class="video-note-bubble"></video>
                    </div>`;
            }

            // Ticks (One tick ✓ initially, Two ticks ✓✓ when read)
            const tickIconClass = data.read ? 'fa-check-double text-[#64b5f6]' : 'fa-check text-gray-300';
            const tickHTML = isMe 
                ? `<i id="tick-${data.id}" class="fa-solid ${tickIconClass} text-[11px] ml-1" title="Receipt"></i>`
                : '';

            const editedHTML = data.edited ? `<span class="text-[10px] text-gray-400 mr-1 italic">edited</span>` : '';

            bubble.innerHTML = `
                ${replyHTML}
                ${contentHTML}
                <div id="reactions-${data.id}" class="flex flex-wrap gap-1 mt-1"></div>
                <div class="absolute bottom-1 right-2.5 flex items-center space-x-0.5 text-[10px] text-[#7f91a4] select-none pointer-events-none">
                    ${editedHTML}
                    <span>${data.time}</span>
                    ${tickHTML}
                </div>
            `;

            msgWrapper.appendChild(bubble);
            chatWindow.appendChild(msgWrapper);

            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
            document.getElementById('sidebarLastMsg').innerText = data.text || `[${data.type} message]`;
        }

        // Context Menu System
        function showContextMenu(e, msgId, isMe) {
            selectedMsgContext = msgId;
            const menu = document.getElementById('contextMenu');
            const editBtn = document.getElementById('ctxEditBtn');

            const msgObj = messagesMap.get(msgId);
            if (msgObj && msgObj.type === 'text' && isMe) {
                editBtn.classList.remove('hidden');
            } else {
                editBtn.classList.add('hidden');
            }

            menu.style.left = `${Math.min(e.clientX, window.innerWidth - 200)}px`;
            menu.style.top = `${Math.min(e.clientY, window.innerHeight - 220)}px`;
            menu.classList.remove('hidden');
        }

        function closeContextMenu() {
            document.getElementById('contextMenu').classList.add('hidden');
        }

        function contextAction(action) {
            closeContextMenu();
            if (!selectedMsgContext) return;
            const msgObj = messagesMap.get(selectedMsgContext);

            if (action === 'reply') {
                replyingToMessageId = selectedMsgContext;
                document.getElementById('replyPreviewText').innerText = msgObj.text || `[${msgObj.type}]`;
                document.getElementById('replyBar').classList.remove('hidden');
                document.getElementById('messageInput').focus();
            } else if (action === 'copy') {
                if (msgObj && msgObj.text) {
                    navigator.clipboard.writeText(msgObj.text);
                    showToast("Copied to clipboard!");
                }
            } else if (action === 'edit') {
                if (msgObj && msgObj.text) {
                    editingMessageId = selectedMsgContext;
                    document.getElementById('messageInput').value = msgObj.text;
                    document.getElementById('editPreviewText').innerText = msgObj.text;
                    document.getElementById('editBar').classList.remove('hidden');
                    document.getElementById('messageInput').focus();
                }
            } else if (action === 'pin') {
                pinnedMessageId = selectedMsgContext;
                document.getElementById('pinText').innerText = msgObj.text || `[${msgObj.type} message]`;
                document.getElementById('pinBanner').classList.remove('hidden');
                showToast("Message pinned");
            } else if (action === 'delete') {
                const wrapper = document.getElementById(`wrapper-${selectedMsgContext}`);
                if (wrapper) wrapper.remove();
                messagesMap.delete(selectedMsgContext);
                if (socket) socket.emit('delete-message', { id: selectedMsgContext, roomId });
                showToast("Message deleted");
            } else if (action === 'react') {
                addReaction(selectedMsgContext, '❤️');
            }
        }

        function addReaction(msgId, emoji) {
            const container = document.getElementById(`reactions-${msgId}`);
            if (container) {
                const badge = document.createElement('span');
                badge.className = "bg-[#101921] px-1.5 py-0.5 rounded-full text-xs border border-white/10 animate-bounce cursor-pointer";
                badge.innerText = emoji;
                container.appendChild(badge);
            }
        }

        function toggleAudioSpeed(msgId) {
            const audio = document.getElementById(`audio-${msgId}`);
            const btn = document.getElementById(`speed-${msgId}`);
            if (audio) {
                if (audio.playbackRate === 1) {
                    audio.playbackRate = 2;
                    btn.innerText = "2x";
                } else {
                    audio.playbackRate = 1;
                    btn.innerText = "1x";
                }
            }
        }

        function cancelEdit() {
            editingMessageId = null;
            document.getElementById('messageInput').value = '';
            document.getElementById('editBar').classList.add('hidden');
        }

        function cancelReply() {
            replyingToMessageId = null;
            document.getElementById('replyBar').classList.add('hidden');
        }

        function unpinMessage() {
            pinnedMessageId = null;
            document.getElementById('pinBanner').classList.add('hidden');
        }

        function scrollToPinned() {
            if (pinnedMessageId) scrollToMessage(pinnedMessageId);
        }

        function scrollToMessage(msgId) {
            const elem = document.getElementById(`wrapper-${msgId}`);
            if (elem) {
                elem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                elem.classList.add('ring-2', 'ring-sky-400', 'rounded-xl');
                setTimeout(() => elem.classList.remove('ring-2', 'ring-sky-400', 'rounded-xl'), 1500);
            }
        }

        function updateMessageUI(msgObj) {
            const textElem = document.getElementById(`text-${msgObj.id}`);
            if (textElem) textElem.innerText = msgObj.text;
        }

        function toggleEmojiPicker() {
            document.getElementById('emojiPicker').classList.toggle('hidden');
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            input.value += emoji;
            input.dispatchEvent(new Event('input'));
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        function toggleChatSearch() {
            const searchBar = document.getElementById('searchBarContainer');
            searchBar.classList.toggle('hidden');
            if (!searchBar.classList.contains('hidden')) {
                document.getElementById('chatSearchInput').focus();
            }
        }

        function filterMessages() {
            const query = document.getElementById('chatSearchInput').value.toLowerCase();
            messagesMap.forEach((msg, id) => {
                const wrapper = document.getElementById(`wrapper-${id}`);
                if (wrapper) {
                    if (msg.text && msg.text.toLowerCase().includes(query)) {
                        wrapper.classList.remove('hidden');
                    } else {
                        wrapper.classList.add('hidden');
                    }
                }
            });
        }

        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href);
            showToast("Chat link copied to clipboard!");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 2500);
        }

        function escapeHTML(str) {
            return (str || '').replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
